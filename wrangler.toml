name = "gomoku"
main = "worker/index.mjs"
compatibility_date = "2026-09-23"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
